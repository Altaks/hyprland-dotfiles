# Hyprland — config minimale de TEST (NVIDIA RTX 3070, driver 580 open)
# But : vérifier l'absence d'artefacts avant toute personnalisation.
# GNOME reste disponible sur l'écran de connexion.

monitor = DP-1, 2560x1440@164.84, 0x0, 1
monitor = DP-2, 1920x1080@144.00, 2560x0, 1
monitor = , preferred, auto, 1

# ~/.local/bin (qs, awww, scripts) is not in the session PATH: binds and exec-once need it
env = PATH,@HOME@/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin

# --- NVIDIA (wiki Hyprland, section Nvidia) ---
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# Applis Electron (Discord, etc.) en Wayland natif
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# Applis Java en XWayland sous un gestionnaire en tuiles (évite fenêtres grises/menus décalés)
env = _JAVA_AWT_WM_NONREPARENTING,1
# Applis Qt (dont le sélecteur de partage d'écran) : palette Pywal via qt6ct
env = QT_QPA_PLATFORMTHEME,qt6ct
# Curseur identique à GNOME
env = XCURSOR_THEME,Cottontail
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
# Modules QML de Quickshell (compilé dans ~/.local)
env = QML_IMPORT_PATH,@HOME@/.local/lib/qt6/qml

# Si le curseur clignote ou laisse des traces, passer à true
cursor {
    no_hardware_cursors = false
}

# --- Démarrage ---
exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user start hyprpolkitagent
exec-once = awww-daemon
exec-once = ~/.local/bin/hypr-wallpaper
exec-once = playerctld daemon
exec-once = waybar
exec-once = qs -c wallpicker -d
exec-once = qs -c clock -d
exec-once = qs -c controls -d
exec-once = qs -c overview -d
exec-once = qs -c snapzone -d
exec-once = hypridle
# Temps d'écran : ActivityWatch + watcher Wayland (tray, serveur localhost:5600)
exec-once = awatcher
# Lanceur Vicinae (serveur ; Super+Espace = vicinae toggle, comme Raycast)
exec-once = vicinae server --replace

# --- Applications ---
$terminal = ptyxis --new-window
$browser = $HOME/Applications/zen_7b3f2b5fc3e05213e1c40baed63ec516.AppImage
$fileManager = nautilus --new-window
$menu = vicinae toggle
$music = spotify --ozone-platform=x11
$minecraft = $HOME/Applications/PrismLauncher-Linux-x86_64_10b093ae096f423da78852807c58255b.AppImage
$discord = discord
$toolbox = $HOME/.local/share/JetBrains/Toolbox/bin/jetbrains-toolbox

# --- Bureaux attachés à leur écran : Samsung = 1..5, AOC = 6..10 ---
workspace = 1, monitor:DP-1, persistent:true, default:true
workspace = 2, monitor:DP-1, persistent:true
workspace = 3, monitor:DP-1, persistent:true
workspace = 4, monitor:DP-1, persistent:true
workspace = 5, monitor:DP-1, persistent:true
workspace = 6, monitor:DP-2, persistent:true, default:true
workspace = 7, monitor:DP-2, persistent:true
workspace = 8, monitor:DP-2, persistent:true
workspace = 9, monitor:DP-2, persistent:true
workspace = 10, monitor:DP-2, persistent:true

# --- Entrées ---
input {
    kb_layout = fr
    kb_variant = azerty    # = « Français (AZERTY) » de GNOME (fr+azerty)
    numlock_by_default = true    # pavé numérique actif à chaque ouverture de session
    follow_mouse = 1
    sensitivity = 0
}

# Couleurs Pywal (régénérées à chaque changement de fond d'écran)
source = ~/.cache/wal/colors-hyprland.conf

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    # Dégradé tournant façon simple-hyprland (accent → sombre → sombre → accent)
    col.active_border = $color4 $background $background $color4 45deg
    col.inactive_border = $background
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

    # Aimantation des fenêtres flottantes (Super+glisser) aux bords et aux autres fenêtres
    snap {
        enabled = true
        window_gap = 15
        monitor_gap = 20
        border_overlap = false
    }
}

decoration {
    rounding = 10
    # Flou identique à simple-hyprland
    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = true
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    # Images par seconde envoyées aux fenêtres render_unfocused quand elles sont cachées
    render_unfocused_fps = 30
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Clic sur une notification (dunst : do_action) → l'appli demande l'activation de sa fenêtre ;
    # sans ça Hyprland l'ignore (fenêtre seulement marquée « urgente ») et on reste où on est.
    focus_on_activate = true
}

# --- Règles de fenêtres ---
# Terminal transparent (flou derrière) : réglé ici, sans toucher à la config de Ptyxis
windowrule = match:class ^(org\.gnome\.Ptyxis)$, opacity 0.88 0.80
# Minecraft continue de tourner sur un bureau caché (sinon il attend une image et se fige)
# swayimg: floating, centred viewer
windowrule = match:class ^(swayimg)$, float on, center on

windowrule = match:class ^(Minecraft.*)$, render_unfocused on
# JetBrains (XWayland) : infobulles (titre " ") et images de glisser-déposer (win1, win2…)
# ne doivent jamais prendre le focus, sinon l'IDE perd le focus et les referme en boucle
windowrule = match:class ^(jetbrains-.*)$, match:title ^(win[0-9]+)$, no_initial_focus on
windowrule = match:class ^(jetbrains-.*)$, match:title ^(win[0-9]+)$, no_focus on
windowrule = match:class ^(jetbrains-.*)$, match:title ^\s*$, no_initial_focus on
windowrule = match:class ^(jetbrains-.*)$, match:title ^\s*$, no_focus on

# --- Raccourcis ---
$mainMod = SUPER

bind = $mainMod, T, exec, $terminal
bind = $mainMod, B, exec, $browser
bind = $mainMod, F, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, D, exec, $discord
bind = $mainMod, C, exec, $HOME/.local/bin/claude-term
bind = $mainMod, S, exec, $music
bind = $mainMod, M, exec, $minecraft
bind = $mainMod, J, exec, $toolbox
bind = $mainMod, P, exec, qs -c wallpicker ipc call wallpicker toggle
bind = $mainMod, TAB, exec, qs -c overview ipc call overview toggle
bind = $mainMod, W, killactive
bind = $mainMod, Q, killactive
bind = , F11, fullscreen
bind = $mainMod, V, togglefloating
# Ranger les fenêtres du bureau en grille / revenir au pavage normal
bind = $mainMod, G, exec, ~/.local/bin/hypr-grid
bind = $mainMod SHIFT, G, exec, ~/.local/bin/hypr-grid off
# Tuile active côte à côte (H) ou empilée (V) avec sa voisine
bind = $mainMod SHIFT, H, exec, ~/.local/bin/hypr-split h
bind = $mainMod SHIFT, V, exec, ~/.local/bin/hypr-split v
bind = $mainMod SHIFT, M, exit
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Alt+Tab : fenêtre suivante du bureau, remise au premier plan (Alt+Maj+Tab : précédente)
bind = ALT, TAB, cyclenext
bind = ALT, TAB, alterzorder, top,activewindow
bind = ALT SHIFT, TAB, cyclenext, prev
bind = ALT SHIFT, TAB, alterzorder, top,activewindow

# Bureau précédent / suivant
bind = $mainMod CTRL, left, workspace, m-1
bind = $mainMod CTRL, right, workspace, m+1
# Emmener la fenêtre sur le bureau précédent / suivant (et la suivre)
bind = $mainMod SHIFT, left, movetoworkspace, m-1
bind = $mainMod SHIFT, right, movetoworkspace, m+1
# Envoyer la fenêtre sur l'autre écran
bind = $mainMod ALT, left, movewindow, mon:l
bind = $mainMod ALT, right, movewindow, mon:r

# Bureaux 1-5 de l'écran courant (rangée de chiffres AZERTY : & é " ' ( )
bind = $mainMod, code:10, exec, ~/.local/bin/hypr-ws 1
bind = $mainMod, code:11, exec, ~/.local/bin/hypr-ws 2
bind = $mainMod, code:12, exec, ~/.local/bin/hypr-ws 3
bind = $mainMod, code:13, exec, ~/.local/bin/hypr-ws 4
bind = $mainMod, code:14, exec, ~/.local/bin/hypr-ws 5
bind = $mainMod SHIFT, code:10, exec, ~/.local/bin/hypr-ws 1 move
bind = $mainMod SHIFT, code:11, exec, ~/.local/bin/hypr-ws 2 move
bind = $mainMod SHIFT, code:12, exec, ~/.local/bin/hypr-ws 3 move
bind = $mainMod SHIFT, code:13, exec, ~/.local/bin/hypr-ws 4 move
bind = $mainMod SHIFT, code:14, exec, ~/.local/bin/hypr-ws 5 move

# Aimantation façon Windows : lâcher au bord haut = plein écran, côtés = moitié, coins = quart
# (aperçu : qs -c snapzone ; ressortir une fenêtre aimantée lui rend sa taille d'avant)
bindn = $mainMod, mouse:272, exec, ~/.local/bin/hypr-dragsnap
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Son
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Touches multimédia (suivent le lecteur actif via playerctld)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Vicinae (lanceur) ---
layerrule = blur on, ignore_alpha 0, match:namespace vicinae
layerrule = no_anim on, match:namespace vicinae

# --- Notifications (dunst) : glissent depuis le bord droit ---
layerrule = animation slide right, match:namespace notifications
