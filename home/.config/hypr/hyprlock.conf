# Écran de verrouillage — couleurs Pywal
source = ~/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6
}

# Heure
label {
    monitor = DP-1
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffee)
    font_size = 110
    font_family = Montserrat Bold
    position = 0, 220
    halign = center
    valign = center
}

# Jour (police de l'horloge de bureau)
label {
    monitor = DP-1
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A" | tr '[:lower:]' '[:upper:]'
    color = rgba(ffffffdd)
    font_size = 34
    font_family = Anurati
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor = DP-1
    size = 320, 56
    outline_thickness = 2
    rounding = 16
    outer_color = $color4
    inner_color = $background
    font_color = $foreground
    check_color = $color2
    fail_color = $color1
    placeholder_text = <i>Mot de passe…</i>
    fail_text = <i>Mot de passe incorrect</i>
    dots_center = true
    fade_on_empty = false
    position = 0, -80
    halign = center
    valign = center
}
